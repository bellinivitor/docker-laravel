name: project-name

## Configuration shared by the application instances
x-app: &app
    build:
        context: .
        dockerfile: ./docker/Dockerfile
        args:
            HOST_UID: ${HOST_UID:-1000}
            HOST_GID: ${HOST_GID:-1000}
    image: project-name-app
    restart: unless-stopped
    volumes:
        - ./:/app
        - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    depends_on:
        database:
            condition: service_healthy
        cache:
            condition: service_healthy
    networks:
        - app-custom-bridge

services:
    ## To add instances, create a new service with `<<: *app` and add it to the upstream in nginx.conf
    app1:
        <<: *app

    app2:
        <<: *app

    web:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/app/public:ro
            # Required to serve the link created by `php artisan storage:link`
            - ./storage/app/public:/app/storage/app/public:ro
        depends_on:
            - app1
            - app2
        networks:
            - app-custom-bridge

    database:
        image: postgres:18-alpine
        restart: unless-stopped
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            # Since Postgres 18 the volume is mounted at /var/lib/postgresql (no longer /data)
            - database-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app-custom-bridge

    cache:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - cache-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app-custom-bridge

networks:
    app-custom-bridge:
        driver: bridge

volumes:
    database-data:
    cache-data:
